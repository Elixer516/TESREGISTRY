<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RegiStream — TESDA RTC KorPhil Davao</title>
    <meta
      name="description"
      content="Student Records & Registrar System for TESDA Regional Training Center KorPhil Davao."
    />
    <!--
      Theme is applied before first paint. Doing this in React would let the
      light palette render for aaaone frame and then flip, which reads as a bug.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('registream.theme') || 'system';
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = stored;
        } catch (e) {
          /* localStorage unavailable — fall through to the light palette. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
