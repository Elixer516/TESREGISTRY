name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The Apps Script Web App that files a public applicant's documents.
          # Set it as a repository *variable* (Settings > Secrets and variables
          # > Actions > Variables) named VITE_DRIVE_RELAY_URL. It is not a
          # secret — it ends up in the client bundle either way — but keeping
          # it out of the repo means it can be rotated without a commit.
          # Unset, the build still succeeds and the upload step explains that
          # it is unavailable rather than failing at submit time.
          VITE_DRIVE_RELAY_URL: ${{ vars.VITE_DRIVE_RELAY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
